# Deployment settings (DOMAIN, ACME_EMAIL, IMAGE_OWNER, OPS_BASIC_AUTH_USERS, ...) come from the
# root .env next to this file; see .env.example. Application secrets live in backend/.env.production.

services:
  traefik:
    image: traefik:v3
    restart: always
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    labels:
      - traefik.enable=true
      # Operator tools (Traefik dashboard, Dozzle) sit behind this basic-auth middleware.
      - traefik.http.middlewares.ops-auth.basicauth.users=${OPS_BASIC_AUTH_USERS:?Set OPS_BASIC_AUTH_USERS in .env}
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:?Set DOMAIN in .env}`)
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=ops-auth

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER in .env}/nehemiah-frontend:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ./frontend/.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      - backend

  # Applies pending migrations once, then exits. The API only starts after it succeeds, and
  # migrations never run inside the API process, where its cluster workers would race them.
  migrate:
    image: ghcr.io/${IMAGE_OWNER}/nehemiah-backend:${IMAGE_TAG:-latest}
    restart: "no"
    command: ["node", "dist/src/database/run-migrations.js"]
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/${IMAGE_OWNER}/nehemiah-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      TRIAL_MODE: "false"
      SWAGGER_ENABLED: "false"
      FRONTEND_URL: https://${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ./backend/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.uptime.tls.certresolver=letsencrypt
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)
      - traefik.http.routers.dozzle.tls.certresolver=letsencrypt
      - traefik.http.routers.dozzle.middlewares=ops-auth
      - traefik.http.services.dozzle.loadbalancer.server.port=8080

volumes:
  letsencrypt:
  postgres_data:
  redis_data:
  uptime_kuma_data:
